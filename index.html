<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenue Andy !</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay">

    <div class="ticket">

        <h1>🇬🇧 Bienvenue Andy ! 🇬🇧</h1>

        <h2>Ton aventure à Londres commence bientôt...</h2>

        <div id="countdown"></div>

        <div class="train-zone">
            <div class="station">Lille Europe</div>

            <div class="track">
                <div id="train">🚄</div>
            </div>

            <div class="station">Londres St Pancras</div>
        </div>

        <div class="mission">

            <h3>🎯 Mission Bus Rouge</h3>

            <p>
                Trouve un bus rouge à impériale et prends une photo devant !
            </p>

        </div>

        <div id="arrivalMessage"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
