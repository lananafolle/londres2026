<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Londres 2026</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay">

<div class="ticket">

<header class="header">
<h2>🚄 EUROSTAR</h2>
<p>25 au 28 novembre 2026</p>
</header>

<h1>🇬🇧 Bienvenue Andy 🇬🇧</h1>

<p class="subtitle">
Ton aventure à Londres commence bientôt...
</p>

<div id="countdown"></div>

<div class="voyage">

<div class="depart">
<img src="images/gare.png" alt="Lille Europe">
<p><strong>Lille Europe</strong></p>
</div>

<div class="track">

<div id="train">
<img src="images/train.png" alt="Eurostar">
</div>

<div class="destination">
<img src="images/bigben.png" alt="Big Ben">
<p><strong>Londres</strong></p>
</div>

</div>

</div>

<section class="mission">

<h3>
<img src="images/bus.png" class="mission-icon">
Mission Bus Rouge
</h3>

<p>
Trouve un bus rouge à impériale et prends une photo devant.
</p>

</section>

<div class="envelope-zone">

<button id="surpriseBtn">
<img src="images/cadeau.png" alt="Cadeau">
</button>

<div id="surprise" style="display:none;">

<img src="images/surprise.png" alt="Surprise">

<h2>🎉 Surprise !</h2>

<p>
Tu pars à Londres avec nous du 25 au 28 novembre 2026 !
</p>

</div>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
